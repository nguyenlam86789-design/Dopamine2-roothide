name: "System-Health-CRN-Ultimate-Fix"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download Original TIPA from My Release
        run: |
          gh release download v1 --pattern "Dopamine.tipa" --repo ${{ github.repository }}
          ls -lh Dopamine.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Advanced Patching (Senne Ultimate Exception)
        run: |
          set -x
          unzip -q Dopamine.tipa -d temp
          APP_PATH=$(find temp/Payload -name "*.app" -type d | head -n 1)
          BINARY_PATH="$APP_PATH/Dopamine"
          INFO_PLIST="$APP_PATH/Info.plist"
          chmod +x "$BINARY_PATH"

          # Dùng Python phẫu thuật tầng sâu - Báo lỗi tiếng Việt nếu vá đểu
          python3 - <<EOF
          import sys
          import os

          with open("$BINARY_PATH", "rb") as f:
              data = f.read()
          
          targets = {
              b"com.opa334.Dopamine-roothide": b"com.apple.kernel.Senne-hide",
              b"patchBasebin": b"senneBasebin",
              b"TweakInject": b"SenneInject"
          }
          
          error = False
          for target, replacement in targets.items():
              if target in data:
                  data = data.replace(target, replacement)
                  print(f"✅ VÁ XỊN: Đã thay thành công chuỗi '{target.decode()}'")
              else:
                  print(f"❌ VÁ ĐỂU: KHÔNG tìm thấy chuỗi '{target.decode()}' trong file gốc!")
                  error = True
          
          if error:
              print("\n‼️ KẾT QUẢ: File gốc của bồ không khớp từ khóa. Bồ xem lại bản Dopamine nhé!")
              sys.exit(1) # Ép GitHub hiện ĐỎ lòm
          
          with open("$BINARY_PATH", "wb") as f:
              f.write(data)
          print("\n🎉 CHÚC MỪNG: Đã lột xác thành công bản Senne Vô Đối!")
          EOF

          # Các bước tàng hình giữ nguyên
          mv "$BINARY_PATH" "$APP_PATH/SystemHealth"
          plutil -replace CFBundleExecutable -string "SystemHealth" "$INFO_PLIST"
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.Senne-check" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.kernel.Senne-check</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"
          echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > "$APP_PATH/AppIcon60x60@3x.png"
          cp "$APP_PATH/AppIcon60x60@3x.png" "$APP_PATH/AppIcon60x60@2x.png"

      - name: Repackaging
        run: |
          cd temp && zip -qr ../SystemHealth_Senne_Final.tipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-Senne-V2
          path: SystemHealth_Senne_Final.tipa
