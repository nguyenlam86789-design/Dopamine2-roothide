name: "System-Health-Senne-Ultimate-V4"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download Original TIPA from My Release
        run: |
          gh release download v1 --pattern "Dopamine.tipa" --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Signing Tools (Lấy ldid về máy chủ)
        run: |
          # Cài đặt ldid để máy chủ GitHub biết cách ký quyền hạn Apple
          brew install ldid

      - name: Advanced Patching (Senne Ultimate Fix - Hardcore Mode)
        run: |
          set -x
          unzip -q Dopamine.tipa -d temp
          APP_PATH=$(find temp/Payload -name "*.app" -type d | head -n 1)
          BINARY_PATH="$APP_PATH/Dopamine"
          INFO_PLIST="$APP_PATH/Info.plist"
          chmod +x "$BINARY_PATH"
          
          # 1. PHẪU THUẬT BINARY (Python)
          python3 - <<EOF
          with open("$BINARY_PATH", "rb") as f:
              data = f.read()
          data = data.replace(b"com.opa334.Dopamine-roothide", b"com.apple.kernel.Senne-check")
          data = data.replace(b"patchBasebin", b"senneBasebin")
          data = data.replace(b"TweakInject", b"SenneInject")
          with open("$BINARY_PATH", "wb") as f:
              f.write(data)
          EOF

          # 2. XÁC NHẬN "XANH XỊN"
          strings "$BINARY_PATH" | grep "Senne-check" && echo "✅ VÁ ID XỊN!" || { echo "❌ VÁ ID THẤT BẠI!"; exit 1; }
          strings "$BINARY_PATH" | grep "senneBasebin" && echo "✅ VÁ LOGIC XỊN!" || { echo "❌ VÁ LOGIC THẤT BẠI!"; exit 1; }

          # 3. FIX LỖI DÒNG 5 (Sử dụng ldid vừa cài)
          ldid -e "$BINARY_PATH" > entitlements.xml
          mv "$BINARY_PATH" "$APP_PATH/SystemHealth"
          NEW_BIN="$APP_PATH/SystemHealth"
          ldid -Sentitlements.xml "$NEW_BIN"

          # 4. TÀNG HÌNH PLUTIL
          plutil -replace CFBundleExecutable -string "SystemHealth" "$INFO_PLIST"
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.Senne-check" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.kernel.Senne-check</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"

      - name: Repackaging
        run: |
          cd temp && zip -qr ../SystemHealth_CRN_Final.tipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-CRN-Final
          path: SystemHealth_CRN_Final.tipa
