name: "System-Health-V5-Final"

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: macos-14
    steps:
      - name: Download Original TIPA
        run: |
          gh release download v1 --pattern "Dopamine.tipa" --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Signing Tools
        run: brew install ldid

      - name: Advanced Patching
        run: |
          set -x
          unzip -q Dopamine.tipa -d temp
          APP_PATH=$(find temp/Payload -name "*.app" -type d | head -n 1)
          BINARY_PATH="$APP_PATH/Dopamine"
          INFO_PLIST="$APP_PATH/Info.plist"
          chmod +x "$BINARY_PATH"
          
          python3 - <<EOF
          with open("$BINARY_PATH", "rb") as f:
              data = f.read()
          data = data.replace(b"TweakInject", b"SenneInject")
          data = data.replace(b"com.opa334.Dopamine-roothide", b"com.apple.kernel.Senne-check")
          data = data.replace(b"patchBasebin", b"senneBasebin")
          with open("$BINARY_PATH", "wb") as f:
              f.write(data)
          EOF

          echo "🔍 KIỂM TRA NGOẠI LỆ..."
          strings "$BINARY_PATH" | grep "SenneInject" && echo "✅ NGOẠI LỆ XỊN!" || exit 1

          ldid -e "$BINARY_PATH" > entitlements.xml
          mv "$BINARY_PATH" "$APP_PATH/SystemHealth"
          NEW_BIN="$APP_PATH/SystemHealth"
          ldid -Sentitlements.xml "$NEW_BIN"

          plutil -replace CFBundleExecutable -string "SystemHealth" "$INFO_PLIST"
          plutil -replace CFBundleIdentifier -string "com.apple.kernel.Senne-check" "$INFO_PLIST"
          plutil -replace CFBundleDisplayName -string "System Health" "$INFO_PLIST"
          plutil -replace CFBundleURLTypes -xml "<array><dict><key>CFBundleURLName</key><string>com.apple.kernel.Senne-check</string><key>CFBundleURLSchemes</key><array><string>store</string><string>itms-apps</string></array></dict></array>" "$INFO_PLIST"
          rm -rf "$APP_PATH/embedded.mobileprovision"

          rm -f "$APP_PATH/Assets.car"
          echo "iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAAAAAC1I0HwAAAAB3RJTUUH6AMCCxs6S0zYMAAAAA9jVGh0Q29udGVudC1UeXBlAHB1Ymxpc2gALmJpbi/atSIAAAAnSURBVFjHY2AYBaNgFIyCUTAKRsEoGAWjYBSMglEwCkbBKBgFowAFAAFMAAFInidpAAAAAElFTkSuQmCC" | base64 -d > "$APP_PATH/AppIcon60x60@3x.png"
          cp "$APP_PATH/AppIcon60x60@3x.png" "$APP_PATH/AppIcon60x60@2x.png"
          plutil -replace CFBundleIcons -xml "<dict><key>CFBundlePrimaryIcon</key><dict><key>CFBundleIconFiles</key><array><string>AppIcon60x60</string></array></dict></dict>" "$INFO_PLIST"

      - name: Repackaging
        run: |
          cd temp
          zip -qr ../SystemHealth_V5_Final.tipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemHealth-V5-Final
          path: SystemHealth_V5_Final.tipa
